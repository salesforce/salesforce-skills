<!DOCTYPE html>
<!-- @h360-artifact-id: salesforce-memories
     Machine-managed stamp — the stable identity of this artifact. Do NOT edit by hand.
     Only the Headless 360 `configure` and `update` skills set it (it equals the `id`
     they pass to create_artifact/update_artifact). It lets the plugin re-identify this
     artifact even if you rename it in Claude. -->
<!--
  Memories — a self-contained Claude Artifact for the headless-360-for-sales plugin.
  It is a TEMPLATE: before creating the artifact the agent substitutes the two
  placeholders below, then pastes the whole file into an Artifact (text/html).

  WHY THIS ARTIFACT EXISTS. In Claude Desktop, the shell/tool sandbox home is
  EPHEMERAL — files written to ~/.claude (or anywhere on disk) do not survive
  between sessions, and a bundled stdio MCP that persists to disk cannot either.
  Artifacts are the only cross-session-durable substrate. So durable memories live
  HERE, inside the artifact, not in a file or a memory MCP.

  This is the "many memories" store — the general-purpose companion to the
  first-class `salesforce-user-profile` artifact. Each entry keeps the same
  frontmatter + body shape as a skill/memory file: a machine-searchable header
  (name, type, tags, updated, summary) plus a markdown body. The full set is inlined
  in the #h360-memories JSON block below, so the whole store renders offline with no
  MCP calls and survives with the artifact.

  ── HOW AN AGENT SEARCHES THESE (read this) ─────────────────────────────────────
  There is no tool that reads an artifact's HTML back. The durable, greppable surface
  a later session CAN read is the artifact's DESCRIPTION field (it persists to the
  workspace's artifacts.json). So the create_artifact/update_artifact `description`
  MUST carry a compact frontmatter INDEX of every memory — one entry each, e.g.:

      Salesforce memories (4). mem:acme-net60[pref;acme,pricing] Acme insists on
      net-60 terms; mem:champion-jted[person;acme,champion] Jane T. is the economic
      buyer at Acme; mem:demo-env-flaky[ops;demo] Sandbox demo org drops SSO; ...

  Format per memory: `mem:<name>[<type>;<tag>,<tag>] <one-line summary>` joined by
  `; `. A future session greps artifacts.json for this artifact, reads the index,
  picks the relevant memory names/summaries, and pulls ONLY those into context —
  never the whole store. The index is the agent's read surface; the summaries are
  therefore first-class (write them to stand alone). The markdown bodies below are
  human-facing (rendered in this card) and travel with the artifact for the human and
  for any future read path — they are not the agent's cross-session search surface.

  SUBSTITUTE BEFORE CREATING (see SKILL.md):
    • var PLUGIN_VERSION = "__PLUGIN_VERSION__";  → the headless-360-for-sales plugin
      version this store was generated with (SKILL.md substitutes the build's
      `[[ version ]]`). Shown as the header pill and stamped onto <html data-plugin-version>.
    • The #h360-memories <script type="application/json"> block → replace its `[]`
      with a JSON array of memory records. Shape (one object per memory):
      {
        "name": "acme-net60",                     // kebab-case id, unique in the store
        "type": "pref",                            // free category: pref | person | ops | account | note | ...
        "tags": ["acme", "pricing"],               // lowercase tags for filtering/search
        "updated": "2026-08-26T14:00:00Z",         // ISO-8601; when this memory was last written
        "summary": "Acme insists on net-60 terms", // ONE rich line — this is what the agent reads back
        "body": "Full markdown notes...\n\nDetail, context, links."  // human-facing detail
      }
      `summary` is required and must stand alone (it is mirrored into the artifact
      description index). `body` is optional but recommended. Omit any field you lack.

  This artifact makes NO MCP calls, so DECLARE NO mcp_tools for it. It caches its
  rendered model in window.storage (best-effort). It never uses fetch, window.claude,
  or localStorage, and contains no <form> tags.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Headless 360 — Memories</title>
  <style>
    /* Headless 360 onboarding-mock tokens: serif display, terracotta accent,
       paper/ink neutrals, Salesforce blue reserved for accents/tags. */
    :root {
      --paper: #fafaf9; --card: #ffffff; --ink: #262421; --ink-2: #33312e;
      --muted: #64748b; --muted-2: #706e6b; --line: #e8ecef;
      --accent: #d97757; --accent-dk: #bf4a2d;
      --sf: #0176d3;
      --ok: #2e844a; --ok-bg: #f0fdf4;
      --info-bg: #eef4ff;
      --shell-radius: 16px; --card-radius: 12px;
      --shell-shadow: 0 16px 32px rgba(0,0,0,.03), 0 4px 12px rgba(0,0,0,.03);
      --card-shadow: 0 2px 8px rgba(15,23,42,.06);
      --font-serif: "Lora", "Tiempos Text", ui-serif, Georgia, "Times New Roman", serif;
      --font-sans: "Salesforce Sans", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font-family: var(--font-sans); font-size: 13px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 860px; margin: 24px auto; padding: 32px 32px 24px;
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--shell-radius); box-shadow: var(--shell-shadow);
    }

    /* Header */
    .toprow { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    h1 { font-family: var(--font-serif); font-weight: 400; font-size: 30px; letter-spacing: -.015em; line-height: 1.1; margin: 0; color: var(--ink); }
    .accent-bar { width: 120px; height: 3px; background: var(--accent); border-radius: 2px; margin: 12px 0 10px; }
    .subtitle { color: var(--muted); font-size: 13px; margin: 0; max-width: 600px; }
    .vpill { display: inline-flex; align-items: center; gap: 6px; background: var(--info-bg); color: var(--sf); font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 999px; flex: 0 0 auto; white-space: nowrap; }

    /* Controls */
    .controls { margin: 22px 0 4px; }
    .search { width: 100%; padding: 11px 14px; font: inherit; color: var(--ink); background: var(--card);
      border: 1px solid var(--line); border-radius: 10px; outline: none; }
    .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(217,119,87,.12); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
    .chipbtn { font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px; cursor: pointer;
      background: #f1f5f9; color: #475569; border: 1px solid transparent; user-select: none; }
    .chipbtn.active { background: var(--info-bg); color: var(--sf); border-color: rgba(1,118,211,.25); }
    .count { margin-left: auto; font-size: 12px; color: var(--muted); }

    /* Memory cards */
    .list { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }
    .mem { background: var(--card); border: 1px solid var(--line); border-radius: var(--card-radius); padding: 16px 18px; box-shadow: var(--card-shadow); }
    .mem .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .mem .name { font-family: var(--font-serif); font-size: 17px; color: var(--ink); margin: 0; }
    .mem .upd { font-size: 11px; color: var(--muted); white-space: nowrap; flex: 0 0 auto; }
    .mem .summary { font-size: 13px; color: var(--ink-2); margin: 7px 0 0; }
    .mem .meta { display: flex; align-items: center; gap: 6px; margin-top: 11px; flex-wrap: wrap; }
    .chip { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
    .chip.type { background: #fdf1ec; color: var(--accent-dk); text-transform: uppercase; letter-spacing: .04em; }
    .chip.tag { background: #f1f5f9; color: #475569; font-weight: 600; }
    .chip.tag::before { content: "#"; opacity: .5; }
    .bodytoggle { margin-top: 12px; }
    .bodytoggle summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--sf); list-style: none; user-select: none; width: fit-content; }
    .bodytoggle summary::-webkit-details-marker { display: none; }
    .bodytoggle summary::before { content: "▸ "; }
    .bodytoggle[open] summary::before { content: "▾ "; }
    .body { margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
    .body p { margin: 0 0 8px; } .body p:last-child { margin-bottom: 0; }
    .body ul { margin: 0 0 8px; padding-left: 20px; } .body li { margin: 2px 0; }
    .body h3, .body h4 { font-family: var(--font-serif); font-weight: 400; color: var(--ink); margin: 10px 0 6px; font-size: 15px; }
    .body code { font-family: var(--font-mono); font-size: 12px; background: #f1f5f9; padding: 1px 5px; border-radius: 4px; }
    .body strong { font-weight: 700; color: var(--ink); }

    .empty { color: var(--muted); font-style: italic; padding: 22px 4px; }
    footer.pf { margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="toprow">
      <div>
        <h1 id="title">Headless 360 — Memories</h1>
        <div class="accent-bar"></div>
        <p class="subtitle">Durable notes the plugin keeps about how you sell — searchable, and carried with this artifact across sessions.</p>
      </div>
      <span class="vpill" id="vpill" style="display:none"></span>
    </div>

    <div class="controls">
      <input class="search" id="search" type="text" placeholder="Search memories — name, summary, tags, or notes…" autocomplete="off" spellcheck="false">
      <div class="filters" id="filters"></div>
    </div>

    <div class="list" id="list"></div>

    <footer class="pf">Managed by the Headless 360 plugin · added automatically as we work, or when you ask me to remember something. <span id="pluginVer"></span></footer>
  </main>

  <!-- The single source of truth for this store: the full memory records (frontmatter
       + body). The agent replaces the [] with a JSON array (see the header contract).
       Kept as application/json so it never executes and is trivially parseable. -->
  <script type="application/json" id="h360-memories">[]</script>

  <script>
    "use strict";

    // Plugin version this store was generated with (agent replaces the token).
    var PLUGIN_VERSION = "__PLUGIN_VERSION__";

    var CACHE_KEY = "h360_memories_v1";

    function $(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function ver() {
      return (typeof PLUGIN_VERSION === "string" && PLUGIN_VERSION.indexOf("__") !== 0) ? PLUGIN_VERSION : "";
    }
    function fmtTs(iso) {
      if (!iso) return "";
      try {
        var d = new Date(iso);
        if (isNaN(d.getTime())) return String(iso);
        return d.toLocaleString(undefined, { year: "numeric", month: "short", day: "numeric" });
      } catch (e) { return String(iso); }
    }
    // Humanize a kebab/snake name for the card title (the raw name stays searchable).
    function humanize(name) {
      return String(name || "").replace(/[-_]+/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
    }

    // ---- load the inlined records ----------------------------------------------
    function loadMemories() {
      try {
        var raw = ($("h360-memories") || {}).textContent || "[]";
        var arr = JSON.parse(raw);
        if (!Array.isArray(arr)) return [];
        // Normalize so a sparse record never breaks rendering/search.
        return arr.map(function (m) {
          m = m && typeof m === "object" ? m : {};
          return {
            name: m.name || "",
            type: (m.type || "note"),
            tags: Array.isArray(m.tags) ? m.tags.map(String) : [],
            updated: m.updated || "",
            summary: m.summary || "",
            body: m.body || ""
          };
        });
      } catch (e) { return []; }
    }

    // ---- minimal, safe markdown for bodies (escape first, then a few inlines) ---
    function md(src) {
      var text = esc(src || "");
      var lines = text.split(/\r?\n/);
      var html = "", inList = false;
      function inline(s) {
        return s
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/`([^`]+)`/g, "<code>$1</code>");
      }
      for (var i = 0; i < lines.length; i++) {
        var ln = lines[i];
        var h = ln.match(/^#{2,4}\s+(.*)$/);
        var bullet = ln.match(/^\s*[-*]\s+(.*)$/);
        if (bullet) {
          if (!inList) { html += "<ul>"; inList = true; }
          html += "<li>" + inline(bullet[1]) + "</li>";
          continue;
        }
        if (inList) { html += "</ul>"; inList = false; }
        if (h) { html += "<h4>" + inline(h[1]) + "</h4>"; }
        else if (ln.trim() === "") { /* paragraph break handled below */ }
        else { html += "<p>" + inline(ln) + "</p>"; }
      }
      if (inList) html += "</ul>";
      return html || "<p></p>";
    }

    var MEMORIES = loadMemories();
    var activeType = "all";
    var queryStr = "";

    function matches(m) {
      if (activeType !== "all" && m.type !== activeType) return false;
      if (!queryStr) return true;
      var hay = (m.name + " " + m.summary + " " + m.body + " " + m.type + " " + m.tags.join(" ")).toLowerCase();
      return queryStr.split(/\s+/).every(function (t) { return !t || hay.indexOf(t) !== -1; });
    }

    function renderFilters() {
      var types = {};
      MEMORIES.forEach(function (m) { types[m.type] = (types[m.type] || 0) + 1; });
      var keys = Object.keys(types).sort();
      var el = $("filters");
      if (!MEMORIES.length) { el.innerHTML = ""; return; }
      var html = '<span class="chipbtn' + (activeType === "all" ? " active" : "") + '" data-type="all">All ' + MEMORIES.length + '</span>';
      html += keys.map(function (k) {
        return '<span class="chipbtn' + (activeType === k ? " active" : "") + '" data-type="' + esc(k) + '">' + esc(k) + " " + types[k] + '</span>';
      }).join("");
      el.innerHTML = html;
      Array.prototype.forEach.call(el.querySelectorAll(".chipbtn"), function (b) {
        b.addEventListener("click", function () { activeType = b.getAttribute("data-type"); renderFilters(); renderList(); });
      });
    }

    function renderList() {
      var el = $("list");
      if (!MEMORIES.length) {
        el.innerHTML = '<div class="empty">No memories saved yet. As we work — or when you tell me to remember something — I\'ll add it here.</div>';
        $("count") && $("count").remove();
        return;
      }
      var shown = MEMORIES.filter(matches);
      // keep a live count in the filter row
      var filters = $("filters");
      var cnt = $("count");
      if (!cnt) { cnt = document.createElement("span"); cnt.className = "count"; cnt.id = "count"; filters.appendChild(cnt); }
      cnt.textContent = shown.length + " of " + MEMORIES.length + " shown";

      if (!shown.length) { el.innerHTML = '<div class="empty">No memories match your search.</div>'; return; }
      el.innerHTML = shown.map(function (m) {
        var tags = m.tags.map(function (t) { return '<span class="chip tag">' + esc(t) + '</span>'; }).join("");
        var body = m.body
          ? '<details class="bodytoggle"><summary>Notes</summary><div class="body">' + md(m.body) + '</div></details>'
          : "";
        return '<div class="mem">' +
          '<div class="head">' +
            '<h3 class="name">' + esc(humanize(m.name) || "Memory") + '</h3>' +
            (m.updated ? '<span class="upd">' + esc(fmtTs(m.updated)) + '</span>' : '') +
          '</div>' +
          (m.summary ? '<p class="summary">' + esc(m.summary) + '</p>' : '') +
          '<div class="meta">' +
            '<span class="chip type">' + esc(m.type) + '</span>' + tags +
          '</div>' +
          body +
        '</div>';
      }).join("");
    }

    function stampVersion() {
      var v = ver();
      if (v) document.documentElement.setAttribute("data-plugin-version", v);
      var pill = $("vpill");
      if (pill && v) { pill.textContent = "v" + v; pill.style.display = ""; }
      var f = $("pluginVer");
      if (f) f.textContent = v ? "Plugin v" + v : "";
    }

    // ---- persistent cache (window.storage only — never localStorage) -----------
    async function writeCache() {
      try {
        if (window.storage) await window.storage.set(CACHE_KEY, JSON.stringify({ version: ver(), memories: MEMORIES }));
      } catch (e) { /* cache is best-effort */ }
    }

    function main() {
      stampVersion();
      renderFilters();
      renderList();
      var s = $("search");
      if (s) s.addEventListener("input", function () { queryStr = s.value.trim().toLowerCase(); renderList(); });
      writeCache();
    }
    main();
  </script>
</body>
</html>
