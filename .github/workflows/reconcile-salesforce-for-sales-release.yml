name: Reconcile Salesforce for Sales release PR

# workflow_run loads this workflow from trusted default-branch code. The preceding
# push workflow is deliberately unprivileged because its YAML comes from the pushed ref.
on:
  workflow_run:
    workflows: ["Salesforce for Sales release candidate"]
    types: [completed]
    branches:
      - "automation/salesforce-for-sales-v*"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: salesforce-for-sales-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: >-
      github.repository == 'salesforce/salesforce-skills' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted target main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch candidate objects without checking them out
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/automation/salesforce-for-sales-v*:refs/remotes/origin/automation/salesforce-for-sales-v*'
          git cat-file -e "$HEAD_SHA^{commit}"

      - name: Validate release candidate
        id: candidate
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_salesforce_for_sales_release.py \
            --repository "$GITHUB_WORKSPACE" \
            --branch "$BRANCH" \
            --expected-head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create, update, or close pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: main
          BRANCH: ${{ steps.candidate.outputs.branch }}
          VERSION: ${{ steps.candidate.outputs.version }}
          FILE_COUNT: ${{ steps.candidate.outputs.file_count }}
          TOTAL_BYTES: ${{ steps.candidate.outputs.total_bytes }}
          HAS_CHANGES: ${{ steps.candidate.outputs.has_changes }}
          VALIDATED_BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          VALIDATED_HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail

          # Fail closed if either ref moved after validation. A newer push gets its own run.
          remote_base_sha="$(git ls-remote --exit-code --heads origin \
            "refs/heads/$BASE_BRANCH" | awk 'NR == 1 {print $1}')"
          remote_head_sha="$(git ls-remote --exit-code --heads origin \
            "refs/heads/$BRANCH" | awk 'NR == 1 {print $1}')"
          [[ "$remote_base_sha" == "$VALIDATED_BASE_SHA" ]] || {
            echo "::error::main moved after validation; rerun the source release"
            exit 1
          }
          [[ "$remote_head_sha" == "$VALIDATED_HEAD_SHA" ]] || {
            echo "::error::candidate moved after validation; waiting for its newer run"
            exit 1
          }

          pulls="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open \
            -f "base=$BASE_BRANCH" \
            -f "head=$GITHUB_REPOSITORY_OWNER:$BRANCH")"
          pull_count="$(jq 'length' <<<"$pulls")"
          [[ "$pull_count" -le 1 ]] || {
            echo "::error::found $pull_count open PRs for exact head $BRANCH"
            exit 1
          }
          pull_number="$(jq -r '.[0].number // empty' <<<"$pulls")"

          if [[ "$HAS_CHANGES" != "true" ]]; then
            if [[ -n "$pull_number" ]]; then
              gh api --method PATCH \
                "repos/$GITHUB_REPOSITORY/pulls/$pull_number" \
                -f state=closed >/dev/null
              echo "Closed obsolete PR #$pull_number because target main already matches." \
                >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Target main already matches; no PR is needed." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          title="Release salesforce-for-sales v$VERSION"
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          {
            echo "Automated update of the generated \`salesforce-for-sales/\` tree."
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Generated files: \`$FILE_COUNT\`"
            echo "- Generated bytes: \`$TOTAL_BYTES\`"
            echo "- Candidate commit: \`$VALIDATED_HEAD_SHA\`"
            echo
            echo "The target-owned release workflow verified that this branch is exactly one"
            echo "commit on top of current \`main\`, changes only \`salesforce-for-sales/**\`,"
            echo "contains only bounded regular files, and has consistent SemVer metadata."
            echo
            echo "Promotion from \`main\` to \`claude-prod\` remains a separate review gate."
          } > "$body_file"

          if [[ -n "$pull_number" ]]; then
            pull_json="$(gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/pulls/$pull_number" \
              -f "title=$title" \
              -F "body=@$body_file" \
            )"
            action=Updated
          else
            pull_json="$(gh api --method POST \
              "repos/$GITHUB_REPOSITORY/pulls" \
              -f "title=$title" \
              -f "head=$BRANCH" \
              -f "base=$BASE_BRANCH" \
              -F "body=@$body_file" \
            )"
            action=Created
          fi

          pull_number="$(jq -r '.number' <<<"$pull_json")"
          pull_url="$(jq -r '.html_url' <<<"$pull_json")"
          pull_head_sha="$(jq -r '.head.sha' <<<"$pull_json")"
          if [[ "$pull_head_sha" != "$VALIDATED_HEAD_SHA" ]]; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/pulls/$pull_number" \
              -f state=closed >/dev/null
            echo "::error::PR head moved during reconciliation; closed PR #$pull_number"
            exit 1
          fi

          final_base_sha="$(git ls-remote --exit-code --heads origin \
            "refs/heads/$BASE_BRANCH" | awk 'NR == 1 {print $1}')"
          final_head_sha="$(git ls-remote --exit-code --heads origin \
            "refs/heads/$BRANCH" | awk 'NR == 1 {print $1}')"
          if [[ "$final_base_sha" != "$VALIDATED_BASE_SHA" || \
                "$final_head_sha" != "$VALIDATED_HEAD_SHA" ]]; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/pulls/$pull_number" \
              -f state=closed >/dev/null
            echo "::error::A validated ref moved during reconciliation; closed PR #$pull_number"
            exit 1
          fi

          echo "$action PR: $pull_url" >> "$GITHUB_STEP_SUMMARY"
