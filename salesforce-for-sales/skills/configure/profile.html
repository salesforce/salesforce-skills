<!DOCTYPE html>
<!-- @h360-artifact-id: salesforce-user-profile
     Machine-managed stamp — the stable identity of this artifact. Do NOT edit by hand.
     Only the Headless 360 `configure` and `update` skills set it (it equals the `id`
     they pass to create_artifact/update_artifact). It lets the plugin re-identify this
     artifact even if you rename it in Claude. -->
<!--
  Your Profile — a self-contained Claude Artifact for the headless-360-for-sales
  plugin. It is a TEMPLATE: before creating the artifact the agent substitutes the
  one placeholder below, then pastes the whole file into an Artifact (text/html).

  This layout matches the Headless 360 onboarding mock ("Your Profile"): a serif
  title with a terracotta accent bar and subtitle, a sticky section header that names
  the section you're viewing (Summary · Who you are · Salesforce context · Working
  preferences · What I can't see) and updates as you scroll, a "The short version"
  summary of up to three highlight cards, then a two-column "Detailed Profile" of
  sections — each with a colored kind-tag, an intro line, and label/value/source field
  rows — followed by a "What I can't see today" strip. The sticky header tracks whatever
  rendered: each of its five labels maps to a real section (by kind, then title) and is
  skipped if that section is absent, so it never names a section that isn't there. It
  scroll-spies to show the section currently in view.

  SUBSTITUTE BEFORE CREATING (see SKILL.md step 3):
    • var PLUGIN_VERSION = "__PLUGIN_VERSION__";  → the headless-360-for-sales plugin
      version this card was generated with (SKILL.md substitutes the build's
      `[[ version ]]`). Stamped into the footer and exposed as `data-plugin-version`
      on <html> so a later plugin update can detect a card built by an older version.
    • var PROFILE = {} ;  → replace the {} with the profile object you gathered in
      step 1, as a JSON literal. Shape (omit anything you don't have):
      {
        "name": "Sona",
        "role": "Senior Account Executive, North America mid-market",
        "subtitle": "A living profile that shapes how Claude helps",   // optional; a default is used
        "sources": ["Salesforce","Calendar","Slack"],                  // drives the subtitle source line
        "highlights": [            // up to 3 cards for "The short version"
          { "title": "How you sell", "value": "Relationship-led, technical sale",
            "body": "You bring economic and technical buyers together early.",
            "sources": ["Opportunity contacts (Salesforce)"] }
        ],
        "sections": [             // the Detailed Profile
          { "title": "Who you are", "kind": "confirm", "intro": "Quick check — does this look right?",
            "fields": [
              { "label": "Role", "value": "Senior AE, NA mid-market", "source": "Salesforce" },
              { "label": "Deal velocity", "value": "47 days median", "source": "Inferred" }
            ] }
        ],
        "cantSee": [              // "What I can't see today"
          { "label": "Google Drive", "value": "Not connected — no access to proposal drafts" }
        ]
      }
      kind ∈ confirm | review | auto | tell | thin | system | none — each maps to a
      labeled, colored tag (see KIND map). source ∈ Salesforce | Gmail | Slack |
      Calendar | Inferred | (any string) — each known source renders its inlined brand
      icon in the pill (see SRC_ICON); "Inferred" also renders a distinct terracotta pill.

  This artifact makes NO MCP calls — the profile is inlined, so it renders even where
  no MCP server is connected. Because it calls no tools, DECLARE NO mcp_tools for it.
  It uses window.cowork.askClaude(prompt, []) only for a one-line role narrative, with
  a composed fallback. It caches the rendered model in window.storage. It never uses
  fetch to an API, never uses window.claude/localStorage, and contains no <form> tags.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salesforce User Profile</title>
  <style>
    /* Headless 360 onboarding-mock tokens: serif display, terracotta accent,
       paper/ink neutrals, Salesforce blue reserved for accents/tags. */
    :root {
      --paper: #fafaf9; --card: #ffffff; --ink: #262421; --ink-2: #33312e;
      --muted: #64748b; --muted-2: #706e6b; --line: #e8ecef; --line-2: #e2e8f0;
      --accent: #d97757; --accent-dk: #bf4a2d;
      --sf: #0176d3; --sf-dk: #032d60;
      --ok: #2e844a; --ok-bg: #f0fdf4; --warn: #ea580c; --warn-bg: #fff7ed;
      --err: #ba0517; --info-bg: #eef4ff; --slate: #0f172a;
      --shell-radius: 16px; --card-radius: 12px;
      --shell-shadow: 0 16px 32px rgba(0,0,0,.03), 0 4px 12px rgba(0,0,0,.03);
      --card-shadow: 0 2px 8px rgba(15,23,42,.06);
      --font-serif: "Lora", "Tiempos Text", ui-serif, Georgia, "Times New Roman", serif;
      --font-sans: "Salesforce Sans", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font-family: var(--font-sans); font-size: 13px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 960px; margin: 24px auto; padding: 32px 32px 24px;
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--shell-radius); box-shadow: var(--shell-shadow);
    }

    /* Header */
    .toprow { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    h1 { font-family: var(--font-serif); font-weight: 400; font-size: 32px; letter-spacing: -.015em; line-height: 1.1; margin: 0; color: var(--ink); }
    .accent-bar { width: 120px; height: 3px; background: var(--accent); border-radius: 2px; margin: 12px 0 10px; }
    .subtitle { color: var(--muted); font-size: 13px; margin: 0; max-width: 640px; }
    .verified { display: inline-flex; align-items: center; gap: 6px; background: var(--ok-bg); color: var(--ok); font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; flex: 0 0 auto; }

    .status { font-size: 12px; color: var(--muted); margin: 10px 2px 0; min-height: 15px; }
    .narrative { background: color-mix(in srgb, var(--accent) 7%, #fff); border: 1px solid color-mix(in srgb, var(--accent) 22%, #fff); border-left: 3px solid var(--accent); border-radius: var(--card-radius); padding: 12px 16px; color: var(--accent-dk); margin: 16px 0 18px; min-height: 16px; }

    /* Sticky section header — names the section currently in view and updates as you
       scroll (Summary · Who you are · Salesforce context · Working preferences · What
       I can't see). Not clickable: a scroll-spy label, not a nav. Hidden until it has
       a label to show. */
    .stickyhead { position: sticky; top: 0; z-index: 5; display: none; align-items: center; gap: 8px; margin: 4px -32px 20px; padding: 11px 32px; background: color-mix(in srgb, var(--card) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
    .stickyhead.on { display: flex; }
    .stickyhead .eye { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); flex: 0 0 auto; }
    .stickyhead .dot { width: 5px; height: 5px; border-radius: 999px; background: var(--accent); flex: 0 0 auto; }
    .stickyhead .cur { font-family: var(--font-serif); font-size: 16px; color: var(--ink); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .12s ease; }
    /* Offset scroll-spy anchors so a section registers as it clears the sticky header. */
    .jt { scroll-margin-top: 60px; }

    /* The short version */
    .eyebrow { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 2px 4px; }
    .h2 { font-family: var(--font-serif); font-weight: 400; font-size: 22px; letter-spacing: -.012em; margin: 0 2px 14px; color: var(--ink); }
    .highlights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 8px; }
    @media (max-width: 760px) { .highlights { grid-template-columns: 1fr; } }
    .hl { background: var(--card); border: 1px solid var(--line); border-radius: var(--card-radius); padding: 16px; box-shadow: var(--card-shadow); }
    .hl .cap { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .hl .v { font-family: var(--font-serif); font-size: 18px; color: var(--ink); margin: 6px 0 6px; line-height: 1.25; }
    .hl .b { font-size: 12px; color: var(--ink-2); }
    .hl .src { font-size: 11px; color: var(--muted); margin-top: 8px; }

    /* Detailed Profile — 2-column masonry */
    .detail { columns: 2; column-gap: 18px; }
    @media (max-width: 760px) { .detail { columns: 1; } }
    .sec { break-inside: avoid; -webkit-column-break-inside: avoid; page-break-inside: avoid; display: inline-block; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: var(--card-radius); padding: 16px 18px; margin-bottom: 18px; box-shadow: var(--card-shadow); }
    .sec .sh { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .sec h3 { font-family: var(--font-serif); font-weight: 400; font-size: 18px; letter-spacing: -.01em; margin: 0; color: var(--ink); }
    .sec .intro { font-size: 12px; color: var(--muted); margin: 6px 0 10px; }
    .tag { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; flex: 0 0 auto; }
    .tag.confirm { background: var(--info-bg); color: var(--sf); }
    .tag.auto { background: var(--ok-bg); color: var(--ok); }
    .tag.review { background: var(--warn-bg); color: var(--warn); }
    .tag.tell { background: color-mix(in srgb, var(--accent) 12%, #fff); color: var(--accent-dk); }
    .tag.thin { background: #f1f5f9; color: #475569; }
    .tag.system { background: #f1f5f9; color: #475569; }

    .frow { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: baseline; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
    .frow:last-child { border-bottom: 0; }
    .frow .k { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .frow .val { grid-column: 1 / -1; font-weight: 600; color: var(--ink); }
    .frow .src { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-size: 10px; font-weight: 600; color: var(--muted); background: #f6f6f5; border: 1px solid var(--line); padding: 2px 8px 2px 6px; border-radius: 999px; align-self: start; }
    .frow .src.inferred { background: color-mix(in srgb, var(--accent) 10%, #fff); border-color: color-mix(in srgb, var(--accent) 24%, #fff); color: var(--accent-dk); }

    /* Source badge icons — reproduced verbatim from the onboarding mock
       (Salesforce / Inferred / Slack / Gmail), plus a matching Calendar glyph. */
    .slogo { width: 13px; height: 13px; flex: 0 0 13px; display: inline-flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 3px; }
    .slogo svg { display: block; }
    .slogo.sinferred, .slogo.ssalesforce, .slogo.scalendar { border-radius: 0; overflow: visible; }
    .slogo.sslack { display: grid; grid-template-columns: repeat(2, 5px); grid-template-rows: repeat(2, 5px); gap: 1px; overflow: visible; }
    .slogo.sslack i { width: 5px; height: 5px; border-radius: 1.5px; display: block; }
    .slogo.sslack i:nth-child(1) { background: #36c5f0; }
    .slogo.sslack i:nth-child(2) { background: #2eb67d; }
    .slogo.sslack i:nth-child(3) { background: #e01e5a; }
    .slogo.sslack i:nth-child(4) { background: #ecb22e; }
    .slogo.sgmail { color: #d93025; font: 800 10px/1 Arial, Helvetica, sans-serif; }
    .slogo.scalendar { color: var(--sf); }
    .frow.hasrc { grid-template-columns: minmax(0,1fr) auto; }
    .frow.hasrc .k { grid-column: 1; }
    .frow.hasrc .src { grid-column: 2; grid-row: 1 / span 2; }

    /* What I can't see today */
    .cantsee { background: #f8fafc; border: 1px solid var(--line); border-radius: var(--card-radius); padding: 16px 18px; margin-top: 6px; }
    .cantsee .row { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .cantsee .row:last-child { border-bottom: 0; }
    .cantsee .k { font-weight: 600; color: var(--ink); flex: 0 0 160px; }
    .cantsee .v { color: var(--muted-2); font-size: 12px; }
    .empty { color: var(--muted); font-style: italic; }
    footer.pf { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="toprow">
      <div>
        <h1 id="name">Salesforce User Profile</h1>
        <div class="accent-bar"></div>
        <p class="subtitle" id="subtitle">A living profile that shapes how Claude helps</p>
      </div>
      <span class="verified" id="verified" style="display:none">✓ Verified</span>
    </div>

    <div class="stickyhead" id="stickyhead" role="status" aria-live="polite" aria-label="Current section">
      <span class="eye">Section</span>
      <span class="dot" aria-hidden="true"></span>
      <span class="cur" id="stickyCur"></span>
    </div>

    <div class="status" id="status"></div>
    <div class="narrative" id="narrative"><span class="empty">Summarizing your role…</span></div>

    <div id="shortVersion"></div>

    <h2 class="eyebrow jt" id="jp-detail">Detailed Profile</h2>
    <p class="h2" id="detailTitle">What I've learned about how you work and sell</p>
    <div class="detail" id="detail"></div>

    <div id="cantSeeWrap"></div>

    <footer class="pf">Compiled by Claude from your connected sources · review and refine anytime by re-running configure. <span id="pluginVer"></span></footer>
  </main>

  <script>
    "use strict";

    // ---- inlined profile (agent replaces the {} with a JSON literal) -----------
    // No MCP call is made here; the profile is baked in at create time so the card
    // renders anywhere. See the header for the substitution contract.
    var PROFILE = {};

    // Plugin version this card was generated with (agent replaces the token). Stamped
    // into the footer + <html data-plugin-version> so a later update can spot a card
    // built by an older plugin version.
    var PLUGIN_VERSION = "__PLUGIN_VERSION__";

    var CACHE_KEY = "h360_user_profile_v2";

    // kind → { label, css class } for section tags (mock's kind-tag vocabulary)
    var KIND = {
      confirm: { label: "Quick confirm", cls: "confirm" },
      auto:    { label: "Always current", cls: "auto" },
      review:  { label: "Worth a second look", cls: "review" },
      tell:    { label: "Tell me", cls: "tell" },
      thin:    { label: "Thinner data", cls: "thin" },
      system:  { label: "No action needed", cls: "system" }
    };

    function $(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // ---- source badge icons (inlined from the onboarding mock) -----------------
    // Each source label maps to a small brand glyph shown inside its pill. Icons are
    // self-contained (inline SVG / colored squares / a letter glyph) — no external
    // assets, no icon font — so the pill renders identically anywhere.
    var SRC_ICON = {
      salesforce: '<span class="slogo ssalesforce" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="8.1" viewBox="0 0 32.6083 20.3062" fill="none"><path d="M13.8833 1.9C14.9333 0.771875 16.3917 0.11875 17.9667 0.11875C20.0083 0.11875 21.8167 1.1875 22.8667 2.85C23.7417 2.43438 24.7333 2.25625 25.725 2.25625C29.5167 2.25625 32.6083 5.40313 32.6083 9.2625C32.6083 13.1219 29.5167 16.2687 25.725 16.2687C25.0833 16.2687 24.5 16.2094 23.9167 16.0312C22.9833 17.4563 21.4083 18.4062 19.6 18.4062C18.6667 18.4062 17.7917 18.1687 17.0333 17.6937C16.1 19.2375 14.4083 20.3063 12.4833 20.3063C10.5 20.3063 8.80833 19.2375 7.875 17.575C7.11667 18.05 6.18333 18.4062 5.25 18.4062C2.33333 18.4062 0 16.0312 0 13.0625C0 11.0437 1.10833 9.2625 2.74167 8.37188C2.50833 7.48125 2.33333 6.53125 2.33333 5.58125C2.33333 2.49375 4.78333 0 7.81667 0C9.56667 0 11.0833 0.771875 12.1333 2.01875" fill="#00A1E0"/></svg></span>',
      inferred: '<span class="slogo sinferred" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2c.5 0 .9.4.9.9v6l4.2-4.2a.9.9 0 111.2 1.3l-4.1 4.2h6a.9.9 0 010 1.8h-6l4.2 4.2a.9.9 0 11-1.3 1.3l-4.1-4.2v6a.9.9 0 01-1.8 0v-6l-4.2 4.2a.9.9 0 01-1.3-1.3l4.2-4.2h-6a.9.9 0 010-1.8h6L5.8 7.2a.9.9 0 011.2-1.3l4.1 4.2V4.1c0-.5.4-.9.9-.9z"/></svg></span>',
      slack: '<span class="slogo sslack" aria-hidden="true"><i></i><i></i><i></i><i></i></span>',
      gmail: '<span class="slogo sgmail" aria-hidden="true">M</span>',
      calendar: '<span class="slogo scalendar" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg></span>'
    };
    // Map a free-text source string to an icon key (Google/Calendar → calendar).
    function srcIconFor(source) {
      var s = String(source || "").toLowerCase();
      if (/inferred/.test(s)) return SRC_ICON.inferred;
      if (/salesforce|\bsfdc\b|\bcrm\b/.test(s)) return SRC_ICON.salesforce;
      if (/slack/.test(s)) return SRC_ICON.slack;
      if (/gmail|email|\bmail\b/.test(s)) return SRC_ICON.gmail;
      if (/calendar|google|gcal|meeting/.test(s)) return SRC_ICON.calendar;
      return "";
    }
    function isEmptyProfile(p) {
      if (!p || typeof p !== "object") return true;
      return !p.name && !(p.sections && p.sections.length) && !(p.highlights && p.highlights.length);
    }

    // ---- persistent cache (window.storage only — never localStorage) ----------
    async function writeCache(obj) {
      try { if (window.storage) await window.storage.set(CACHE_KEY, JSON.stringify(obj)); }
      catch (e) { /* cache is best-effort */ }
    }

    // ---- askClaude helper ------------------------------------------------------
    function coerceText(out) {
      if (out == null) return "";
      if (typeof out === "string") return out;
      if (typeof out.text === "string") return out.text;
      if (out.content != null) {
        if (typeof out.content === "string") return out.content;
        if (Array.isArray(out.content)) {
          return out.content
            .filter(function (b) { return b && b.type === "text" && typeof b.text === "string"; })
            .map(function (b) { return b.text; }).join("");
        }
        if (typeof out.content.text === "string") return out.content.text;
      }
      if (out.message) return coerceText(out.message);
      return "";
    }
    async function llmText(prompt) {
      if (!window.cowork || typeof window.cowork.askClaude !== "function") return "";
      try { return coerceText(await window.cowork.askClaude(prompt, [])); }
      catch (e) { return ""; }
    }
    function composedNarrative(p) {
      var role = p.role || (p.sections && p.sections[0] && p.sections[0].fields && p.sections[0].fields.find(function (f) { return /role/i.test(f.label); }));
      var lead = "You" + (p.role ? " are " + p.role : " work in Salesforce");
      return lead + ".";
    }
    function sourcesLine(p) {
      var s = Array.isArray(p.sources) && p.sources.length ? p.sources : ["Salesforce"];
      return "A living profile that shapes how Claude helps · Compiled from " +
        s.join(", ").replace(/, ([^,]*)$/, " and $1") + " · Updated today";
    }

    // ---- sticky section header (scroll-spy label, not a nav) -------------------
    // Five curated labels, in the mock's order. Each resolves to a real anchor on the
    // page: Summary → the short-version block; the three middle labels → the Detailed
    // Profile section whose kind matches (with a title-regex fallback); What I can't see
    // → the gaps block. A label is tracked ONLY if its target actually rendered, so the
    // header never names a missing section — a profile with no highlights simply skips
    // Summary. As you scroll, the header shows whichever tracked section is topmost.
    var NAV_SPEC = [
      { label: "Summary", id: "jp-summary" },
      { label: "Who you are", kinds: ["confirm"], title: /who you are|your role|identity/i },
      { label: "Salesforce context", kinds: ["auto"], title: /pipeline|salesforce|book of business|opportunit/i },
      { label: "Working preferences", kinds: ["tell", "user"], title: /work with me|working preference|how you like|preference/i },
      { label: "What I can't see", id: "jp-cantsee" }
    ];
    function sectionAnchorFor(spec, secs) {
      // by kind first (faithful to the mock's kind→section mapping)
      for (var i = 0; i < secs.length; i++) {
        if (spec.kinds && spec.kinds.indexOf(secs[i].kind) !== -1) return "jp-sec-" + i;
      }
      // then by title regex
      if (spec.title) {
        for (var j = 0; j < secs.length; j++) {
          if (spec.title.test(secs[j].title || "")) return "jp-sec-" + j;
        }
      }
      return null;
    }
    var navTargets = [];       // [{label, targetId}] tracked sections, in page order
    var curTarget = null;      // targetId currently shown in the sticky header
    function buildStickyHead(p, secs) {
      var head = $("stickyhead");
      if (!head) return;
      navTargets = [];
      NAV_SPEC.forEach(function (spec) {
        var targetId = spec.id || sectionAnchorFor(spec, secs);
        if (!targetId || !document.getElementById(targetId)) return;   // skip missing targets
        navTargets.push({ label: spec.label, targetId: targetId });
      });
      if (!navTargets.length) return;   // nothing to track → header stays hidden
      head.classList.add("on");
      setActiveSection(navTargets[0].targetId);
      setupScrollSpy();
    }
    function setActiveSection(targetId) {
      if (targetId === curTarget) return;
      var entry = null;
      for (var i = 0; i < navTargets.length; i++) {
        if (navTargets[i].targetId === targetId) { entry = navTargets[i]; break; }
      }
      if (!entry) return;
      curTarget = targetId;
      var cur = $("stickyCur");
      if (cur) cur.textContent = entry.label;
    }
    var spyOn = false;
    function setupScrollSpy() {
      if (spyOn || typeof IntersectionObserver !== "function") return;
      spyOn = true;
      var visible = {};
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { visible[e.target.id] = e.isIntersecting ? e.boundingClientRect.top : null; });
        // pick the topmost currently-intersecting tracked section
        var best = null, bestTop = Infinity;
        navTargets.forEach(function (t) {
          var top = visible[t.targetId];
          if (top != null && top < bestTop) { bestTop = top; best = t.targetId; }
        });
        if (best) setActiveSection(best);
      }, { rootMargin: "-55px 0px -70% 0px", threshold: 0 });
      navTargets.forEach(function (t) { var el = document.getElementById(t.targetId); if (el) io.observe(el); });
    }

    // ---- rendering -------------------------------------------------------------
    function render(p) {
      if (isEmptyProfile(p)) {
        $("status").textContent = "No profile data was inlined — re-run configure to build one.";
        $("narrative").style.display = "none";
        return;
      }
      $("name").textContent = p.name ? ("Salesforce User Profile — " + p.name) : "Salesforce User Profile";
      $("subtitle").textContent = p.subtitle ? p.subtitle : sourcesLine(p);
      if (p.verified) $("verified").style.display = "";

      // The short version
      var hs = Array.isArray(p.highlights) ? p.highlights.slice(0, 3) : [];
      if (hs.length) {
        $("shortVersion").innerHTML =
          '<h2 class="eyebrow jt" id="jp-summary">The short version</h2>' +
          '<p class="h2">What I\'ve learned about how you work and sell</p>' +
          '<div class="highlights">' + hs.map(function (h) {
            var src = Array.isArray(h.sources) && h.sources.length ? '<div class="src">Sources: ' + esc(h.sources.join(", ")) + '</div>' : '';
            return '<div class="hl"><div class="cap">' + esc(h.title || "") + '</div>' +
              '<div class="v">' + esc(h.value || "") + '</div>' +
              (h.body ? '<div class="b">' + esc(h.body) + '</div>' : '') + src + '</div>';
          }).join("") + '</div>';
        $("detailTitle").textContent = "The underlying fields — verify or edit any of these";
      } else {
        $("detailTitle").textContent = "What I've learned about how you work and sell";
      }

      // Detailed Profile
      var secs = Array.isArray(p.sections) ? p.sections : [];
      if (secs.length) {
        $("detail").innerHTML = secs.map(function (s, i) {
          var k = KIND[s.kind];
          var tag = (k && s.kind !== "none") ? '<span class="tag ' + k.cls + '">' + esc(k.label) + '</span>' : '';
          var fields = Array.isArray(s.fields) ? s.fields : [];
          var rows = fields.map(function (f) {
            var hasSrc = !!f.source;
            var srcCls = /inferred/i.test(f.source || "") ? "src inferred" : "src";
            var icon = hasSrc ? srcIconFor(f.source) : "";
            return '<div class="frow' + (hasSrc ? ' hasrc' : '') + '">' +
              '<div class="k">' + esc(f.label || "") + '</div>' +
              (hasSrc ? '<div class="' + srcCls + '">' + icon + esc(f.source) + '</div>' : '') +
              '<div class="val">' + esc(f.value != null && f.value !== "" ? f.value : "—") + '</div>' +
              '</div>';
          }).join("");
          return '<div class="sec jt" id="jp-sec-' + i + '"><div class="sh"><h3>' + esc(s.title || "") + '</h3>' + tag + '</div>' +
            (s.intro ? '<div class="intro">' + esc(s.intro) + '</div>' : '') + rows + '</div>';
        }).join("");
      } else {
        $("detail").innerHTML = '<div class="empty">No detailed fields recorded yet.</div>';
      }

      // What I can't see today
      var cs = Array.isArray(p.cantSee) ? p.cantSee : [];
      if (cs.length) {
        $("cantSeeWrap").innerHTML =
          '<h2 class="eyebrow jt" id="jp-cantsee">What I can\'t see today</h2>' +
          '<p class="h2">Gaps worth knowing about</p>' +
          '<div class="cantsee">' + cs.map(function (c) {
            return '<div class="row"><div class="k">' + esc(c.label || "") + '</div><div class="v">' + esc(c.value || "") + '</div></div>';
          }).join("") + '</div>';
      }

      // Build the sticky header last, so every section anchor (incl. jp-cantsee) exists.
      buildStickyHead(p, secs);
    }

    // ---- one-line role narrative (askClaude, with a composed fallback) ---------
    async function narrate(p) {
      var el = $("narrative");
      if (isEmptyProfile(p)) { el.style.display = "none"; return; }
      var slim = { name: p.name, role: p.role, highlights: (p.highlights || []).map(function (h) { return h.title + ": " + h.value; }) };
      var out = await llmText(
        "In one warm sentence (no preamble), summarize this Salesforce rep's role and selling focus for a " +
        "welcome screen. Second person (\"You...\"). Data:\n" + JSON.stringify(slim));
      el.textContent = (out && out.trim()) ? out.trim() : composedNarrative(p);
    }

    // Stamp the plugin version this card was generated with — footer (visible) +
    // <html data-plugin-version> (machine-readable) — for later staleness detection.
    function stampVersion() {
      var v = (typeof PLUGIN_VERSION === "string" && PLUGIN_VERSION.indexOf("__") !== 0) ? PLUGIN_VERSION : "";
      if (v) document.documentElement.setAttribute("data-plugin-version", v);
      var el = $("pluginVer");
      if (el) el.textContent = v ? "Plugin v" + v : "";
    }

    async function main() {
      stampVersion();
      render(PROFILE);
      await writeCache(PROFILE);
      await narrate(PROFILE);
    }
    main();
  </script>
</body>
</html>
